# P0 - the smallest pipeline that can be reasoned about:
#   receiver (otlp) -> processor (batch) -> exporters (debug + elasticsearch)
# One pipeline is declared per signal type; they share components but are
# independent paths.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317   # binary, streaming, what SDKs default to
      http:
        endpoint: 0.0.0.0:4318   # firewall/proxy friendly, curl-able

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # First and best diagnostic tool: prints every record the pipeline carries.
  debug:
    verbosity: detailed

  elasticsearch:
    endpoints: ["http://elasticsearch:9200"]
    mapping:
      mode: otel
    # Documents land in data streams named
    #   <signal>-<data_stream.dataset>-<data_stream.namespace>
    # e.g. traces-generic.otel-default. Setting the data_stream.dataset /
    # data_stream.namespace attributes on the telemetry redirects them.
    retry:
      enabled: true
    sending_queue:
      enabled: true

service:
  telemetry:
    logs:
      level: info
    # Self-telemetry: the Collector's own metrics, scrapeable at :8888/metrics.
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, elasticsearch]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, elasticsearch]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, elasticsearch]
