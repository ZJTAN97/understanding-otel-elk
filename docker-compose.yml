# P0 - pipeline skeleton: Elasticsearch, Kibana, OpenTelemetry Collector.
# Security is disabled deliberately for P0-P5; it comes back in P6.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms${ES_JAVA_HEAP} -Xmx${ES_JAVA_HEAP}
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "${ES_PORT}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot: install the OTel index templates ES 8.14 does not ship.
  es-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: es-init
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      - ./elasticsearch:/init:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${COLLECTOR_VERSION}
    container_name: otel-collector
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT}:4317"       # OTLP/gRPC
      - "${OTLP_HTTP_PORT}:4318"       # OTLP/HTTP
      - "${COLLECTOR_METRICS_PORT}:8888"  # own Prometheus metrics
    depends_on:
      es-init:
        condition: service_completed_successfully

volumes:
  es-data:
