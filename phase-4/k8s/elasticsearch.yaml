# Elasticsearch 8.19.21 — Phase 04 topology. Supersedes phase-3/k8s/elasticsearch.yaml.
#
# Three dedicated masters, two data+ingest nodes. Five JVMs on one laptop:
# 3 x 768Mi + 2 x 1280Mi = 4.75Gi of limits. Sized down from 7Gi: k3d runs every
# "node" inside one Docker VM but each reports the whole VM as allocatable, so
# the scheduler happily overcommits until CoreDNS starves and pods die with
# "Temporary failure in name resolution". Heaps are small because this cluster
# holds lab-sized data; the topology is the lesson, not the capacity.
#
# Limits are ~3x heap, not 1x. The JVM needs metaspace, direct buffers, thread
# stacks and code cache outside -Xmx; 512Mi around a 256m heap gets OOMKilled.
#
# There is NO dedicated ingest nodeSet. With the OTel Collector doing enrichment
# upstream (00-decisions.md D4), a third tier solves a problem this cluster does
# not have. Revisit only if Q2 volume says otherwise.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: obs
  namespace: eck
spec:
  version: 8.19.21

  nodeSets:
    # Three, because quorum is (3/2)+1 = 2: one master can die. Two masters
    # tolerate zero failures and add split-brain risk; four tolerate one, same
    # as three, for the cost of another JVM.
    - name: master
      count: 3
      config:
        # Declaring node.roles is exhaustive: ml, transform and
        # remote_cluster_client are now OFF on these nodes. Deliberate.
        node.roles: ["master"]
        node.store.allow_mmap: false
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                # Masters hold cluster state, not shards.
                storage: 1Gi
            storageClassName: local-path
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  memory: 768Mi
                  cpu: 500m
                limits:
                  memory: 768Mi
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms256m -Xmx256m"

    - name: data
      count: 2
      config:
        node.roles: ["data", "ingest"]
        node.store.allow_mmap: false
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi
            storageClassName: local-path
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  memory: 1280Mi
                  cpu: 1
                limits:
                  memory: 1280Mi
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms512m -Xmx512m"
